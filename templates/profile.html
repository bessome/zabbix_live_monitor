{% extends "base.html" %}{% block title %}Мои настройки · Zabbix Live Monitoring{% endblock %}
{% block content %}
<h1>Мои настройки</h1>
<form method="post" action="/profile" class="panel profile-panel">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<fieldset class="theme-options">
<legend>Тема оформления</legend>
<label class="theme-option">
{% if current_user.theme == "light" %}
<input type="radio" name="theme" value="light" checked>
{% else %}
<input type="radio" name="theme" value="light">
{% endif %}
<span><strong>Светлая</strong><small>Светлый фон и тёмный текст</small></span>
</label>
<label class="theme-option">
{% if current_user.theme == "dark" %}
<input type="radio" name="theme" value="dark" checked>
{% else %}
<input type="radio" name="theme" value="dark">
{% endif %}
<span><strong>Тёмная</strong><small>Тёмный фон и светлый текст</small></span>
</label>
</fieldset>
<button type="submit">Сохранить</button>
</form>
<form method="post" action="/profile/password" class="panel profile-panel">
<h2>Сменить пароль</h2>
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Текущий пароль <input type="password" name="current_password" required autocomplete="current-password"></label>
<label>Новый пароль <input type="password" name="new_password" required minlength="9" autocomplete="new-password"></label>
<label>Повторите новый пароль <input type="password" name="new_password_confirm" required minlength="9" autocomplete="new-password"></label>
<button type="submit">Изменить пароль</button>
</form>
{% endblock %}
