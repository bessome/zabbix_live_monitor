{% extends "base.html" %}{% block title %}Вход · Zabbix Live Monitoring{% endblock %}
{% block content %}<section class="panel narrow"><h1>Вход</h1>
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Имя пользователя или email <input name="username" autocomplete="username" required autofocus></label>
<label>Пароль <input type="password" name="password" autocomplete="current-password" required></label>
<button type="submit">Войти</button></form></section>{% endblock %}
